<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroVoice</title>

  <style>
    body {
      margin: 0;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitlu {
      margin-top: 0;
      color: #b7c1d1;
    }

    .pagina {
      max-width: 1000px;
      margin: auto;
      padding: 25px;
    }

    .intrebare {
      margin: 30px 0 20px;
      font-size: 40px;
    }

    .raspunsuri {
      display: flex;
      gap: 25px;
      justify-content: center;
    }

    .raspuns {
      width: 400px;
      height: 330px;
      border: 4px solid white;
      border-radius: 20px;
      background: #263249;
      color: white;
      font-size: 55px;
      font-weight: bold;
      cursor: pointer;
    }

    .raspuns small {
      display: block;
      margin-top: 15px;
      font-size: 20px;
    }

    .da.palpaie {
      animation: lumina 0.1s steps(1) infinite;
    }

    .nu.palpaie {
      animation: lumina 0.0667s steps(1) infinite;
    }

    @keyframes lumina {
      0%, 49% {
        background: white;
        color: black;
      }

      50%, 100% {
        background: black;
        color: white;
      }
    }

    .butoane {
      margin-top: 25px;
    }

    .buton {
      margin: 5px;
      padding: 12px 22px;
      border: 0;
      border-radius: 10px;
      background: #5795f5;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .mesaj {
      min-height: 70px;
      margin-top: 25px;
      padding: 18px;
      border-radius: 14px;
      background: #202b40;
      font-size: 22px;
    }

    .urgent {
      background: #a72c39;
    }

    .avertisment {
      color: #ffcf7a;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      .raspunsuri {
        flex-direction: column;
      }

      .raspuns {
        width: 100%;
        height: 250px;
      }
    }
  </style>
</head>

<body>
  <div class="pagina">
    <h1>NeuroVoice</h1>
    <p class="subtitlu">Pacientul răspunde privind DA sau NU</p>

    <h2 class="intrebare" id="intrebare">Ai dureri?</h2>

    <div class="raspunsuri">
      <button class="raspuns da" id="da" onclick="alege('da')">
        DA
        <small>10 Hz</small>
      </button>

      <button class="raspuns nu" id="nu" onclick="alege('nu')">
        NU
        <small>15 Hz</small>
      </button>
    </div>

    <div class="butoane">
      <button class="buton" onclick="porneste()">START</button>
      <button class="buton" onclick="opreste()">STOP</button>
      <button class="buton" onclick="resetare()">REÎNCEPE</button>
    </div>

    <div class="mesaj" id="mesaj">
      Apasă START pentru a începe.
    </div>

    <p class="avertisment">
      Atenție: conține lumini intermitente. Nu se folosește de persoane
      cu epilepsie fotosensibilă.
    </p>
  </div>

  <script>
    let etapa = "durere";

    let pornit = false;

    let avertismentAcceptat = false;

    function porneste() {
      if (!avertismentAcceptat) {
        let acceptat = confirm(
          "Ecranul va pâlpâi rapid. Nu continua dacă ai epilepsie fotosensibilă."
        );

        if (!acceptat) {
          return;
        }

        avertismentAcceptat = true;
      }

      pornit = true;
      document.getElementById("da").classList.add("palpaie");
      document.getElementById("nu").classList.add("palpaie");
      document.getElementById("mesaj").innerText =
        "Privește răspunsul dorit timp de 2-3 secunde.";
    }

    function opreste() {
      pornit = false;
      document.getElementById("da").classList.remove("palpaie");
      document.getElementById("nu").classList.remove("palpaie");
    }

    function schimbaIntrebarea(text) {
      document.getElementById("intrebare").innerText = text;

      setTimeout(porneste, 700);
    }

    function alege(raspuns) {
      if (!pornit) {
        document.getElementById("mesaj").innerText =
          "Apasă START înainte să alegi.";
        return;
      }

      opreste();

      if (etapa === "durere") {
        if (raspuns === "da") {
          etapa = "durerePuternica";
          schimbaIntrebarea("Durerea este foarte puternică?");
        } else {
          etapa = "respiratie";
          schimbaIntrebarea("Respiri greu?");
        }
      }

      else if (etapa === "durerePuternica") {
        if (raspuns === "da") {
          termina(
            "Mă doare foarte tare. Vă rog chemați asistenta!",
            true
          );
        } else {
          termina(
            "Am dureri, dar nu sunt foarte puternice. Am nevoie de ajutor.",
            false
          );
        }
      }

      else if (etapa === "respiratie") {
        if (raspuns === "da") {
          termina(
            "Respir greu. Vă rog chemați imediat asistenta!",
            true
          );
        } else {
          etapa = "pozitie";
          schimbaIntrebarea("Vrei să îți schimbe poziția?");
        }
      }

      else if (etapa === "pozitie") {
        if (raspuns === "da") {
          termina("Vreau să îmi schimbați poziția, vă rog.", false);
        } else {
          etapa = "apa";
          schimbaIntrebarea("Ai nevoie de apă?");
        }
      }

      else if (etapa === "apa") {
        if (raspuns === "da") {
          termina("Am nevoie de apă, vă rog.", false);
        } else {
          etapa = "asistenta";
          schimbaIntrebarea("Vrei să chemi asistenta?");
        }
      }

      else if (etapa === "asistenta") {
        if (raspuns === "da") {
          termina("Vă rog să chemați asistenta.", false);
        } else {
          termina("Nu am selectat nicio nevoie.", false);
        }
      }
    }

    function termina(text, urgent) {
      opreste();

      let casetaMesaj = document.getElementById("mesaj");
      casetaMesaj.innerText = text;
      casetaMesaj.classList.toggle("urgent", urgent);

      document.getElementById("intrebare").innerText = "Mesaj transmis";

      let voce = new SpeechSynthesisUtterance(text);
      voce.lang = "ro-RO";
      speechSynthesis.speak(voce);
    }

    function resetare() {
      opreste();
      etapa = "durere";
      document.getElementById("intrebare").innerText = "Ai dureri?";
      document.getElementById("mesaj").innerText =
        "Apasă START pentru a începe.";
      document.getElementById("mesaj").classList.remove("urgent");
    }

    
    document.addEventListener("keydown", function(event) {
      if (event.key.toLowerCase() === "d") {
        alege("da");
      }

      if (event.key.toLowerCase() === "n") {
        alege("nu");
      }

      if (event.key === "Escape") {
        opreste();
      }
    });
  </script>
</body>
</html>
